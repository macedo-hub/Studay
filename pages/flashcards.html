    <main class="content">
        <h1 class="page-title">Flashcards</h1>

        <div class="flashcard-area">

            <!-- Abas -->
            <div class="flashcard-tabs" role="tablist">
                <button id="tab-flashcards" class="flashcard-tab menu-active"
                        role="tab" aria-selected="true" aria-controls="flashcards-content">
                    Flashcards
                </button>
                <button id="tab-gerenciar" class="flashcard-tab"
                        role="tab" aria-selected="false" aria-controls="manage-content">
                    Gerenciar
                </button>
            </div>

            <!-- Aba: Estudar -->
            <div id="flashcards-content" class="flashcard-content" role="tabpanel">
                <div class="flashcard-display-container">
                    <div class="flashcard-card" id="flashcard-card">
                        <div class="flashcard-front" id="flashcard-question-display">
                            Clique na seta para começar!
                        </div>
                        <div class="flashcard-back" id="flashcard-answer-display"></div>
                    </div>
                </div>

                <div class="flashcard-controls">
                    <button id="btn-incorrect" class="feedback-btn errado" title="Incorreto" aria-label="Marcar como incorreto">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3z"/>
                            <path d="M17 2h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"/>
                        </svg>
                    </button>

                    <button id="btn-flip" class="flip-btn" title="Mostrar Resposta" aria-label="Virar flashcard">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <line x1="5" y1="12" x2="19" y2="12"/>
                            <polyline points="12 5 19 12 12 19"/>
                        </svg>
                    </button>

                    <button id="btn-correct" class="feedback-btn certo" title="Correto" aria-label="Marcar como correto">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3z"/>
                            <path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/>
                        </svg>
                    </button>
                </div>

                <button id="btn-next" class="next-btn hidden">Próximo Flashcard</button>
            </div>

            <!-- Aba: Gerenciar -->
            <div id="manage-content" class="flashcard-content hidden" role="tabpanel">

                <button id="btn-add-new-flashcard" class="add-new-flashcard-btn">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    Adicionar Novo Flashcard
                </button>

                <form id="flashcard-form" class="hidden">
                    <label for="input-question">Pergunta:</label>
                    <textarea id="input-question" placeholder="Digite a pergunta..." required></textarea>

                    <label for="input-answer">Resposta:</label>
                    <textarea id="input-answer" placeholder="Digite a resposta..." required></textarea>

                    <div class="form-actions">
                        <button type="submit" id="btn-save-flashcard">Salvar Flashcard</button>
                        <button type="button" id="cancel-edit" class="cancel-btn">Cancelar</button>
                    </div>
                </form>

                <div id="flashcards-list" class="manage-list"></div>
            </div>

        </div>
    </main>

</div>
