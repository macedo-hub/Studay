    <main class="content">

                <form id="media-form">
                    <div id="notas-container">

                        <!-- Nota 1 -->
                        <div class="nota-row sem-lixeira">
                            <input type="number" class="nota-input"
                                   placeholder="Nota 1 (0 a 100)" min="0" max="100" step="0.01">
                        </div>

                        <!-- Nota 2 -->
                        <div class="nota-row sem-lixeira">
                            <input type="number" class="nota-input"
                                   placeholder="Nota 2 (0 a 100)" min="0" max="100" step="0.01">
                        </div>

                    </div>

                    <!-- Botão adicionar nota -->
                    <button type="button" id="add-nota-btn" class="add-nota-btn"
                            aria-label="Adicionar mais uma nota">+</button>

                    <p id="mensagem-erro-media" class="hidden" role="alert"></p>

                    <!-- Botão calcular -->
                    <button type="submit" class="btn-calcular">Calcular Média</button>
                </form>
            </div>

            <!-- Resultado -->
            <div id="resultado-box" class="resultado-box" aria-live="polite">
                <p class="resultado-label">Sua média final</p>
                <p id="resultado-media">—</p>
                <p id="resultado-status" class="resultado-status"></p>
